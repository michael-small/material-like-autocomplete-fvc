<pre>value: {{value() | json}}</pre>
<pre>rawValue: {{rawValue() | json}}</pre>

<form class="example-form">
  <mat-form-field class="example-full-width">
    <mat-label>Assignee</mat-label>
    <input type="text" matInput [errorStateMatcher]="errorStateMatcher" [value]="rawValue()"
      (input)="rawValue.set($event.target.value)" (blur)="touch.emit()" [matAutocomplete]="auto" />
    @for (error of errors(); track error) {
    <mat-error>{{ error.message ?? (error.kind === 'required' ? 'This field is required' : error.kind) }}</mat-error>
    }
    <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selectOption($event.option.value)">
      @for (option of filteredOptions(); track option) {
      <mat-option [value]="option">{{valFn()(option)}}</mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>
</form>

<pre>{{myErrors() | json}}</pre>
